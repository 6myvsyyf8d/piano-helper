<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="钢琴练习助手">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css?v=20260822b">
<title>🎹 钢琴练习助手</title>
</head>

<body>
<div class="app">
  <!-- 头部 -->
  <div class="header" id="header">
    <div class="header-content">
      <div class="logo-area" id="logoArea" onclick="document.getElementById('logoInput').click()" title="更换头像">
        <img id="logoImg" src="" style="display:none" alt="Logo">
        <span class="logo-placeholder" id="logoPlaceholder">🎹</span>
      </div>
      <input type="file" id="logoInput" accept="image/*" style="display:none" onchange="handleLogoUpload(event)">

      <div class="header-title">
        <h1>钢琴练习助手</h1>
        <div class="header-subtitle" id="headerVersion">v4.0</div>
      </div>

      <div class="header-actions">
        <button class="sync-btn synced" id="syncBtn" onclick="showSyncPanel()" title="多设备迁移 / 备份">
          <span class="sync-icon">🔄</span>
          <span>迁移</span>
        </button>
        <button class="sync-btn" id="helpBtn" onclick="Onboarding.start()" title="使用说明">
          <span class="sync-icon">📖</span>
          <span>使用说明</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 主内容 -->
  <div class="main" id="mainContent">
    <div class="page active" id="page-today"></div>
    <div class="page" id="page-lessons"></div>
    <div class="page" id="page-calendar"></div>
    <div class="page" id="page-repertoire"></div>
    <div class="page" id="page-stats"></div>
  </div>

  <!-- 底部标签栏 -->
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="today">
      <span class="tab-icon">🏠</span>
      <span class="tab-label">今日</span>
    </button>
    <button class="tab-btn" data-tab="lessons">
      <span class="tab-icon">📒</span>
      <span class="tab-label">课程</span>
    </button>
    <button class="tab-btn" data-tab="calendar">
      <span class="tab-icon">📅</span>
      <span class="tab-label">日历</span>
    </button>
    <button class="tab-btn" data-tab="repertoire">
      <span class="tab-icon">🎵</span>
      <span class="tab-label">曲库</span>
    </button>
    <button class="tab-btn" data-tab="stats">
      <span class="tab-icon">📊</span>
      <span class="tab-label">统计</span>
    </button>
  </div>
</div>

<!-- 模态框容器 -->
<div id="modalContainer"></div>

<!-- 基础设施：事件总线 + 存储适配器 + Schema 版本管理（Phase 0） -->
<script src="js/events.js?v=20260818f"></script>
<script src="js/storage-adapter.js?v=20260822b"></script>
<script src="js/schema.js?v=20260818f"></script>

<!-- 数据层 + 管理层（基础依赖） -->
<script src="js/data.js?v=20260818f"></script>
<script src="js/managers.js?v=20260821b"></script>

<!-- Phase 1 模块（依赖 data/managers） -->
<script src="js/feedback.js?v=20260822a"></script>
<script src="js/lesson-audio.js?v=20260818f"></script>
<script src="js/lesson-markers.js?v=20260822a"></script>
<script src="js/sheet-annotator.js?v=20260822a"></script>
<script src="js/feedback-organizer.js?v=20260822a"></script>
<script src="js/suggestions.js?v=20260819c"></script>
<script src="js/onboarding.js?v=20260818f"></script>

<!-- 今日练琴模块（5 个子文件，必须按此顺序） -->
<script src="js/today/state.js?v=20260818f"></script>
<script src="js/today/render.js?v=20260822b"></script>
<script src="js/today/timer.js?v=20260818f"></script>
<script src="js/today/review-free.js?v=20260819e"></script>
<script src="js/today/submit.js?v=20260819c"></script>
<script src="js/today/celebrate.js?v=20260822a"></script>

<!-- 课程 + 日历 -->
<script src="js/lessons.js?v=20260821a"></script>
<script src="js/calendar.js?v=20260818f"></script>

<!-- 曲库模块（3 个子文件，必须按此顺序） -->
<script src="js/repertoire/browser.js?v=20260822b"></script>
<script src="js/repertoire/editor.js?v=20260818f"></script>
<script src="js/repertoire/sync.js?v=20260822b"></script>

<!-- QR 码库（生成 + 扫码） -->
<script src="js/qrcode-generator.min.js?v=20260818f"></script>
<script src="js/html5-qrcode.min.js?v=20260818f"></script>

<!-- 统计 + 应用入口 -->
<script src="js/stats.js?v=20260818f"></script>
<script src="js/app.js?v=20260822b"></script>
</body>
</html>
